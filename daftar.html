<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Pendonor — DarahKita</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #18181B; --panel: #27272A; --border: #3F3F46; --ink: #FAFAFA; --muted: #A1A1AA; --blood: #EF4444; --font-serif: 'Instrument Serif', serif; --font-sans: 'Inter', sans-serif; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--ink); font-family: var(--font-sans); line-height: 1.5; display: flex; flex-direction: column; min-height: 100vh; }
        a { color: var(--ink); text-decoration: none; }

        /* Warning Banner */
        .portfolio-banner { position: fixed; top: 0; left: 0; width: 100%; height: 40px; background: #2D1A1A; color: var(--blood); border-bottom: 1px solid var(--blood); display: flex; justify-content: center; align-items: center; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; z-index: 101; text-transform: uppercase; }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 0 5vw; height: 72px; border-bottom: 1px solid var(--border); background: rgba(24, 24, 27, 0.9); position: fixed; top: 40px; width: 100%; z-index: 100; }
        .nav-brand { font-family: var(--font-serif); font-size: 1.5rem; font-style: italic; display: flex; align-items: center; gap: 8px; }
        .nav-brand span { width: 8px; height: 8px; background: var(--blood); border-radius: 50%; }
        .back-link { font-size: 0.9rem; color: var(--muted); font-weight: 500; transition: 0.2s; }
        .back-link:hover { color: var(--ink); }

        .wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 140px 20px 40px; }
        .form-container { width: 100%; max-width: 600px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 40px; }
        .header h1 { font-family: var(--font-serif); font-size: 2.2rem; margin-bottom: 8px; font-weight: 400; }
        .header p { font-size: 0.95rem; color: var(--muted); margin-bottom: 32px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; font-weight: 600;}
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--ink); font-family: var(--font-sans); font-size: 0.95rem; outline: none; transition: 0.3s; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--blood); }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .btn-submit { width: 100%; padding: 16px; background: var(--blood); color: #fff; border: none; border-radius: 8px; font-family: var(--font-sans); font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { background: #DC2626; }

        footer { padding: 20px 5vw; text-align: center; font-size: 0.8rem; color: var(--muted); border-top: 1px solid var(--border); }

        @media (max-width: 768px) { .portfolio-banner { font-size: 0.65rem; } .form-container { padding: 30px 20px; } }
    </style>
</head>
<body>

    <!-- Warning Banner -->
    <div class="portfolio-banner">
        ⚠️ PORTFOLIO SHOWCASE — Web ini hanya simulasi untuk keperluan portofolio.
    </div>

    <nav>
        <div class="nav-brand"><span></span> DarahKita.</div>
        <a href="index.html" class="back-link">← Kembali ke Beranda</a>
    </nav>

    <div class="wrapper">
        <div class="form-container">
            <div class="header">
                <h1>Formulir Pendonor.</h1>
                <p>Data Anda dilindungi dan hanya digunakan untuk keperluan darurat medis.</p>
            </div>
            
            <form id="donorForm">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="nameInput" required placeholder="Nama sesuai KTP">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Golongan Darah</label>
                        <select id="bloodType" required>
                            <option value="" disabled selected>Pilih</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="AB">AB</option>
                            <option value="O">O</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Rhesus (Rh)</label>
                        <select id="rhesus" required>
                            <option value="" disabled selected>Pilih</option>
                            <option value="+">Positif (+)</option>
                            <option value="-">Negatif (-)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Nomor WhatsApp</label>
                    <input type="tel" id="contactInput" required placeholder="08xxxxxxxxxx">
                </div>

                <div class="form-group">
                    <label>Domisili (Kota / Kecamatan)</label>
                    <input type="text" id="locationInput" required placeholder="Contoh: Jakarta Selatan, Tebet">
                </div>

                <div class="form-group">
                    <label>Riwayat Donor Terakhir (Bulan/Tahun)</label>
                    <input type="text" id="lastDonor" placeholder="Contoh: Mei 2026 (Kosongkan jika belum pernah)">
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Kirim Data Pendonor</button>
            </form>
        </div>
    </div>

    <footer>
        &copy; 2026 DarahKita Community. Dikelola oleh Frost & Hog.
    </footer>

    <script>
        document.getElementById('donorForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Menyimpan Data...";
            btn.disabled = true;

            setTimeout(() => {
                alert("✅ Terima kasih! Data Anda telah masuk ke database pendonor DarahKita.");
                btn.innerText = "Kirim Data Pendonor";
                btn.disabled = false;
                this.reset();
                window.location.href = "index.html"; 
            }, 1500);
        });
    </script>
</body>
</html>
